<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>hdnews — 유통·홈쇼핑 뉴스 모니터링</title>
  <meta name="description" content="유통 업계와 홈쇼핑 12개사의 뉴스·리스크를 한눈에 모니터링">
  <link rel="icon" type="image/svg+xml" href="assets/news-icon.svg">
  <link rel="stylesheet" href="assets/style.css?v=19">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo-icon"><img src="assets/news-icon.svg" alt="hdnews"></div>
      <nav class="side-nav">
        <a href="#/home" data-tab="home"><span class="nav-emoji">🏠</span>홈</a>
        <a href="#/discover" data-tab="discover"><span class="nav-emoji">🧭</span>발견</a>
        <a href="#/issues" data-tab="issues"><span class="nav-emoji">🗞️</span>이슈 타임라인<span class="alert-dot" hidden></span></a>
        <a href="#/retail" data-tab="retail"><span class="nav-emoji">🔥</span>유통 NEWS</a>
        <a href="#/homeshopping" data-tab="homeshopping"><span class="nav-emoji">🛍️</span>홈쇼핑 NEWS</a>
        <a href="#/scrap" data-tab="scrap"><span class="nav-emoji">⭐</span>스크랩 <span class="scrap-count"></span></a>
      </nav>
      <div class="side-stats" id="sideStats"></div>
      <div class="sidebar-footer">
        <p>네이버 뉴스 API · 구글뉴스 RSS<br>30분 주기 자동 수집</p>
      </div>
    </aside>

    <div class="content">
      <header class="site-header">
        <div class="header-row">
          <a href="#/home" title="홈"><img class="logo-mobile" src="assets/news-icon.svg" alt="hdnews"></a>
          <span class="updated-at" id="updatedAt"></span>
          <div class="header-actions">
            <div class="search-wrap">
              <input type="search" id="searchInput" class="search-input" placeholder="뉴스 검색" autocomplete="off">
              <button id="searchClear" class="search-clear" title="검색 초기화" hidden>✕</button>
            </div>
            <button id="recentBtn" class="icon-btn" title="최근 본 기사">🕒</button>
            <button id="alertBtn" class="icon-btn" title="팔로우한 이슈의 새 기사">🔔<span class="alert-dot" hidden></span></button>
            <button id="themeToggle" class="icon-btn" title="다크/라이트 전환">🌙</button>
          </div>
        </div>
        <nav class="tab-bar" id="tabBar">
          <a href="#/home" data-tab="home">홈</a>
          <a href="#/retail" data-tab="retail">유통</a>
          <a href="#/homeshopping" data-tab="homeshopping">홈쇼핑</a>
          <a href="#/topic/risk" data-tab="risk">리스크</a>
          <a href="#/scrap" data-tab="scrap">스크랩 <span class="scrap-count"></span></a>
        </nav>
      </header>

      <main id="main">
        <div id="loading" class="empty-state">데이터를 불러오는 중…</div>
      </main>

      <footer class="site-footer">
        <p>네이버 뉴스 검색 API · 구글뉴스 RSS 기반 자동 수집 · 30분 주기 갱신</p>
      </footer>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="주요 화면">
    <a href="#/home" data-nav="home"><span class="nav-ico">🏠</span>홈</a>
    <a href="#/discover" data-nav="discover"><span class="nav-ico">🧭</span>발견</a>
    <a href="#/issues" data-nav="issues"><span class="nav-ico">🗞️</span>이슈<span class="alert-dot" hidden></span></a>
    <a href="#/scrap" data-nav="scrap"><span class="nav-ico">⭐</span>스크랩</a>
    <a href="#/companies" data-nav="companies"><span class="nav-ico">🏢</span>회사</a>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-box">
      <div class="modal-head">
        <span id="modalTitle"></span>
        <div class="modal-head-actions">
          <button id="modalGoTab" class="modal-link-btn">유통 종합에서 검색 →</button>
          <button id="modalClose" class="icon-btn" title="닫기">✕</button>
        </div>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="assets/issues-core.js?v=1"></script>
  <script src="assets/app.js?v=21"></script>
</body>
</html>
